<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor de Roupas Roblox</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#eef0f4;--panel:#fff;--tx:#1b1d22;--bd:#d3d7df;--ac:#e2231a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1c20;--panel:#25282e;--tx:#eceef2;--bd:#3a3e46}}
:root[data-theme="dark"]{--bg:#1a1c20;--panel:#25282e;--tx:#eceef2;--bd:#3a3e46}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:12px 16px;font-weight:700;font-size:18px}
main{display:flex;flex-wrap:wrap;gap:12px;padding:0 12px 16px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:10px}
#tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
button,select{font:inherit;padding:7px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button.dl{background:#1f9d4c;color:#fff;border-color:#1f9d4c;font-weight:700}
input[type=color]{width:42px;height:36px;border:1px solid var(--bd);border-radius:8px;padding:2px;background:var(--bg)}
label{display:flex;align-items:center;gap:6px;font-size:14px}
#wrap{flex:1 1 600px;min-width:0}
#scroll{overflow:auto;max-width:100%}
#stage{position:relative;width:585px;height:559px;background:repeating-conic-gradient(#cfd3da 0 25%,#e9ebef 0 50%) 0 0/16px 16px;margin:auto;touch-action:none;transform-origin:0 0}
#stage canvas{position:absolute;left:0;top:0}
#stage{cursor:crosshair}#pantsC,#draw{transition:opacity .15s}
#side{flex:0 1 300px;display:flex;flex-direction:column;gap:8px;align-items:center}
#side h3{margin:0;font-size:14px}
#side canvas{background:#dfe3ea;border-radius:8px;max-width:100%}
small{opacity:.7;font-size:12px}
#sizer{position:relative;margin:0 auto}
button,select{touch-action:manipulation}
.pv{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;flex:1 1 140px;width:100%}
#side canvas{width:100%;height:auto}
@media (max-width:700px){
 header{padding:8px 12px;font-size:16px}
 main{padding:0 8px 12px;gap:8px}
 #tools{gap:5px}
 button,select{padding:9px 10px;font-size:14px;min-height:40px}
 input[type=range]{width:90px}
 #wrap{flex:1 1 100%;padding:6px}
 #side{flex:1 1 100%;flex-direction:row;flex-wrap:wrap;align-items:flex-start}
}
</style>
</head>
<body>
<header>👕 Editor de Roupas Roblox</header>
<main>
<div id="tools" class="panel">
 <button class="m on" id="m-shirt">👕 Camisa</button><button class="m" id="m-pants">👖 Calça</button><span style="opacity:.4">|</span>
 <button id="b-brush" class="t on">🖌️ Pincel</button>
 <button class="t" id="b-erase">🧽 Borracha</button>
 <button class="t" id="b-fill">🪣 Preencher face</button>
 <button class="t" id="b-pick">💧 Conta-gotas</button><button class="t" id="b-hand">✋ Mover</button>
 <input type="color" id="color" value="#e2231a">
 <label>Tam <input type="range" id="size" min="1" max="40" value="6"><span id="sv">6</span></label>
 <label><input type="checkbox" id="guide" checked>Guia</label>
 <label>Zoom <select id="zoom"><option value="fit" selected>Ajustar</option><option value="1">100%</option><option value="1.5">150%</option><option value="2">200%</option><option value="3">300%</option></select></label>
 <button id="undo">↩️ Desfazer</button>
 <button id="clear">🗑️ Limpar</button>
 <button class="dl" id="dl">⬇️ Baixar PNG</button>
</div>
<div id="wrap" class="panel"><div id="scroll"><div id="sizer"><div id="stage">
 <canvas id="guideC" width="585" height="559"></canvas>
 <canvas id="pantsC" width="585" height="559"></canvas>
 <canvas id="draw" width="585" height="559"></canvas>
</div></div></div><small>Desenhe só dentro das faces coloridas (o resto é cortado). Roblox dobra as faces para montar a roupa.</small></div>
<div id="side" class="panel">
 <div class="pv"><h3>Preview frente</h3><canvas id="pf" width="480" height="389"></canvas></div>
 <div class="pv"><h3>Preview costas</h3><canvas id="pb" width="480" height="389"></canvas></div>
</div>
</main>
<script>
// face rects: [name,x,y,w,h,color]
const F=[
["UP",231,8,128,64,"#00a2ff"],["R",165,74,64,128,"#00b050"],["FRONT",231,74,128,128,"#e2231a"],
["L",361,74,64,128,"#f5b800"],["BACK",427,74,128,128,"#0070c0"],["DOWN",231,204,128,64,"#ff8c00"],
["U",217,289,64,64,"#00a2ff"],["L",19,355,64,128,"#f5b800"],["B",85,355,64,128,"#0070c0"],
["R",151,355,64,128,"#00b050"],["F",217,355,64,128,"#e2231a"],["D",217,485,64,64,"#ff8c00"],
["U",308,289,64,64,"#00a2ff"],["F",308,355,64,128,"#e2231a"],["L",374,355,64,128,"#f5b800"],
["B",440,355,64,128,"#0070c0"],["R",506,355,64,128,"#00b050"],["D",308,485,64,64,"#ff8c00"]];
const $=id=>document.getElementById(id);
const shirtC=$('draw'),pantsC=$('pantsC'),gc=$('guideC').getContext('2d');let draw=shirtC,ctx=draw.getContext('2d');const hists={shirt:[],pants:[]};let mode='shirt';
function drawGuide(){
 gc.clearRect(0,0,585,559);
 if(!$('guide').checked)return;
 gc.globalAlpha=.4;
 F.forEach(f=>{gc.fillStyle=f[5];gc.fillRect(f[1],f[2],f[3],f[4]);});
 gc.globalAlpha=.85;gc.fillStyle='#fff';gc.font='bold 18px sans-serif';gc.textAlign='center';gc.textBaseline='middle';
 F.forEach(f=>gc.fillText(f[0],f[1]+f[3]/2,f[2]+f[4]/2));
 gc.globalAlpha=.8;gc.strokeStyle='#fff';gc.setLineDash([4,4]);
 [[165,170,390],[19,423,64*4],[308,423,256]].forEach(l=>{gc.beginPath();gc.moveTo(l[0],l[1]);gc.lineTo(l[0]+l[2],l[1]);gc.stroke();});
 gc.setLineDash([]);gc.globalAlpha=1;
}
function clipPath(c){c.beginPath();F.forEach(f=>c.rect(f[1],f[2],f[3],f[4]));c.clip();}
let tool='brush',down=false,last=null,pan=null,hist=hists.shirt;
function snap(){hist.push(ctx.getImageData(0,0,585,559));if(hist.length>40)hist.shift();}
function pos(e){const r=$('stage').getBoundingClientRect();return{x:(e.clientX-r.left)*585/r.width,y:(e.clientY-r.top)*559/r.height};}
function stroke(a,b){
 ctx.save();clipPath(ctx);
 ctx.lineCap=ctx.lineJoin='round';ctx.lineWidth=+$('size').value;
 if(tool==='erase'){ctx.globalCompositeOperation='destination-out';ctx.strokeStyle='#000';}
 else ctx.strokeStyle=$('color').value;
 ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x+.01,b.y);ctx.stroke();ctx.restore();
}
$('stage').addEventListener('pointerdown',e=>{
 const p=pos(e);
 if(tool==='hand'){const sc=$('scroll');pan={x:e.clientX,y:e.clientY,l:sc.scrollLeft,t:sc.scrollTop};$('stage').setPointerCapture(e.pointerId);return;}
 if(tool==='fill'){const f=F.find(f=>p.x>=f[1]&&p.x<f[1]+f[3]&&p.y>=f[2]&&p.y<f[2]+f[4]);
  if(f){snap();ctx.fillStyle=$('color').value;ctx.fillRect(f[1],f[2],f[3],f[4]);preview();}return;}
 if(tool==='pick'){const d=ctx.getImageData(Math.floor(p.x),Math.floor(p.y),1,1).data;
  if(d[3]){$('color').value='#'+[d[0],d[1],d[2]].map(v=>v.toString(16).padStart(2,'0')).join('');}return;}
 snap();down=true;last=p;$('stage').setPointerCapture(e.pointerId);stroke(p,p);preview();
});
$('stage').addEventListener('pointermove',e=>{if(pan){const sc=$('scroll');sc.scrollLeft=pan.l-(e.clientX-pan.x);sc.scrollTop=pan.t-(e.clientY-pan.y);return;}if(!down)return;const p=pos(e);stroke(last,p);last=p;preview();});
['pointerup','pointercancel'].forEach(t=>$('stage').addEventListener(t,()=>{down=false;pan=null;}));
[['brush','b-brush'],['erase','b-erase'],['fill','b-fill'],['pick','b-pick'],['hand','b-hand']].forEach(([t,id])=>{
 $(id).onclick=()=>{tool=t;document.querySelectorAll('#tools button.t').forEach(b=>b.classList.remove('on'));$(id).classList.add('on');};});
function setMode(m){mode=m;draw=m==='shirt'?shirtC:pantsC;ctx=draw.getContext('2d');hist=hists[m];
 shirtC.style.opacity=m==='shirt'?1:.3;pantsC.style.opacity=m==='pants'?1:.3;
 $('m-shirt').classList.toggle('on',m==='shirt');$('m-pants').classList.toggle('on',m==='pants');}
$('m-shirt').onclick=()=>setMode('shirt');$('m-pants').onclick=()=>setMode('pants');
$('size').oninput=e=>$('sv').textContent=e.target.value;
$('guide').onchange=drawGuide;
$('undo').onclick=()=>{const h=hist.pop();if(h){ctx.putImageData(h,0,0);preview();}};
$('clear').onclick=()=>{snap();ctx.clearRect(0,0,585,559);preview();};
function applyZoom(){const v=$('zoom').value,s=$('stage'),z=v==='fit'?Math.min(2,Math.max(.3,($('wrap').clientWidth-24)/585)):+v;
 s.style.transform='scale('+z+')';s.style.margin='0';
 const z2=$('sizer');z2.style.width=(585*z)+'px';z2.style.height=(559*z)+'px';}
addEventListener('resize',applyZoom);
$('zoom').onchange=applyZoom;
$('dl').onclick=()=>{
 const o=document.createElement('canvas');o.width=585;o.height=559;const c=o.getContext('2d');
 c.save();clipPath(c);c.drawImage(draw,0,0);c.restore();
 const a=document.createElement('a');a.download=mode==='shirt'?'roblox-camisa.png':'roblox-calca.png';a.href=o.toDataURL('image/png');a.click();
};
